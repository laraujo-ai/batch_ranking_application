[project]
name = "batch-ranking"
version = "0.1.0"
description = "Embed a detector's training dataset into Milvus, one collection per model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "torch>=2.7",
    "torchvision>=0.22",
    "timm>=1.0",
    "pymilvus[milvus-lite]>=2.5",
    "boto3>=1.34",
]

[project.scripts]
embed-dataset = "batch_ranking.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch_ranking"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
